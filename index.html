<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* 確保字體適合中文閱讀 */

<body class="bg-slate-100 min-h-screen py-10 px-4 sm:px-6 lg:px-8">

                    國道公路警察局員工分機查詢系統

            <p class="text-center text-blue-600 mt-2 text-sm">請點選單位按鈕或使用關鍵字搜尋</p>
            
            <!-- 新增搜尋列區塊 -->
            <div class="mt-6 max-w-lg mx-auto flex gap-2">
                <input type="text" id="searchInput" placeholder="請輸入姓名、職稱或分機..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">

                    搜尋

        <!-- 按鈕控制區塊 -->
        <div class="px-6 py-6 border-b border-gray-100">
            <div id="categoryContainer" class="space-y-5">
                <!-- 分類與按鈕將由 JavaScript 動態生成 -->
            </div>
        </div>

        <!-- 表格區塊 -->
        <div class="px-6 pb-8 overflow-x-auto">
            <!-- 新增目前顯示狀態標題 -->
            <div id="currentViewTitle" class="py-4 text-lg font-bold text-gray-700 hidden">

            <table class="min-w-full leading-normal border-collapse border border-gray-200 rounded-lg hidden" id="contactTable">

                    <tr>

                        </th>
                        <th class="px-5 py-3 border-b-2 border-blue-600 bg-blue-500 text-left text-sm font-bold text-white tracking-wider w-1/4">
                            職稱
                        </th>
                        <th class="px-5 py-3 border-b-2 border-blue-600 bg-blue-500 text-left text-sm font-bold text-white tracking-wider w-1/4">
                            姓名
                        </th>
                        <th class="px-5 py-3 border-b-2 border-blue-600 bg-blue-500 text-left text-sm font-bold text-white tracking-wider w-1/4">
                            分機
                        </th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 資料將透過 JavaScript 動態載入 -->

            </table>

                請點選上方單位按鈕，以顯示分機資訊。
            </div>
        </div>
    </div>

        document.addEventListener('DOMContentLoaded', () => {
            const categoryContainer = document.getElementById('categoryContainer');
            const tableElement = document.getElementById('contactTable');
            const tableBody = document.getElementById('table-body');
            const emptyState = document.getElementById('empty-state');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const currentViewTitle = document.getElementById('currentViewTitle');

            let currentActiveButton = null;
            let currentActiveDefaultClass = null;

            // 定義按鈕基礎樣式
            const baseClass = 'px-4 py-2 rounded-full text-sm font-medium transition-colors duration-200 ease-in-out border focus:outline-none focus:ring-2 focus:ring-opacity-50';

            // 依據您的需求設定各分類、對應顏色，以及底下的部門清單
            const buttonCategories = [
                { name: '2F', colorKey: 'blue', depts: ['首長電話', '後勤科', '人事室', '主計室', '保防室', '刑警大隊'] },
                { name: '1F', colorKey: 'green', depts: ['勤指中心', '秘書室', '督訓科'] },
                { name: '3F', colorKey: 'purple', depts: ['交通科', '行政科'] },
                { name: 'B1', colorKey: 'orange', depts: ['保安隊'] },
                { name: '其他', colorKey: 'gray', depts: ['職工', '勤務寢室', '資訊股', '其他'] } // 加入了原先有的資訊股，避免遺漏
            ];

            // 完整定義 Tailwind class，避免動態組字串被編譯器過濾掉樣式
            const styles = {
                blue: {
                    badge: 'bg-blue-100 text-blue-800 border-blue-200',
                    default: 'border-blue-300 bg-blue-50 text-blue-700 hover:bg-blue-100 focus:ring-blue-500',
                    active: 'border-blue-600 bg-blue-600 text-white shadow-md focus:ring-blue-500'
                },
                green: {
                    badge: 'bg-green-100 text-green-800 border-green-200',
                    default: 'border-green-300 bg-green-50 text-green-700 hover:bg-green-100 focus:ring-green-500',
                    active: 'border-green-600 bg-green-600 text-white shadow-md focus:ring-green-500'
                },
                purple: {
                    badge: 'bg-purple-100 text-purple-800 border-purple-200',
                    default: 'border-purple-300 bg-purple-50 text-purple-700 hover:bg-purple-100 focus:ring-purple-500',
                    active: 'border-purple-600 bg-purple-600 text-white shadow-md focus:ring-purple-500'
                },
                orange: {
                    badge: 'bg-orange-100 text-orange-800 border-orange-200',
                    default: 'border-orange-300 bg-orange-50 text-orange-700 hover:bg-orange-100 focus:ring-orange-500',
                    active: 'border-orange-600 bg-orange-600 text-white shadow-md focus:ring-orange-500'
                },
                gray: {
                    badge: 'bg-gray-100 text-gray-800 border-gray-200',
                    default: 'border-gray-300 bg-gray-50 text-gray-700 hover:bg-gray-100 focus:ring-gray-500',
                    active: 'border-gray-600 bg-gray-600 text-white shadow-md focus:ring-gray-500'
                }
            };

            // 1. 動態產生分類與內部按鈕
            buttonCategories.forEach(cat => {
                // 建立分類的外層容器
                const section = document.createElement('div');
                section.className = 'flex flex-col md:flex-row md:items-start gap-3 md:gap-4';

                // 建立樓層/分類標題徽章
                const titleBadge = document.createElement('div');
                titleBadge.className = `shrink-0 px-3 py-1.5 rounded text-sm font-bold text-center w-16 border mt-0.5 ${styles[cat.colorKey].badge}`;
                titleBadge.textContent = cat.name;

                // 建立按鈕群組容器
                const btnGroup = document.createElement('div');
                btnGroup.className = 'flex flex-wrap gap-2 md:gap-3 flex-1';

                cat.depts.forEach(dept => {
                    // 若資料物件中尚未建立此部門，自動補上空陣列以免出錯
                    if (!departmentData[dept]) departmentData[dept] = []; 

                    const btn = document.createElement('button');
                    btn.textContent = dept;
                    btn.className = `${baseClass} ${styles[cat.colorKey].default}`;
                    
                    btn.addEventListener('click', () => {
                        // 清空搜尋列
                        searchInput.value = '';

                        // 還原前一個選中按鈕的樣式
                        if (currentActiveButton) {
                            currentActiveButton.className = `${baseClass} ${currentActiveDefaultClass}`;
                        }
                        
                        // 設定當前按鈕為選中樣式
                        btn.className = `${baseClass} ${styles[cat.colorKey].active}`;
                        
                        // 記錄目前的按鈕與該顏色的預設樣式
                        currentActiveButton = btn;
                        currentActiveDefaultClass = styles[cat.colorKey].default;

                        // 組合單位名稱並呼叫更新表格函數
                        const mappedData = departmentData[dept].map(item => ({ department: dept, ...item }));
                        updateTable(mappedData, `目前顯示單位：${dept}`);
                    });
                    
                    btnGroup.appendChild(btn);
                });

                section.appendChild(titleBadge);
                section.appendChild(btnGroup);
                categoryContainer.appendChild(section);
            });

            // 處理搜尋邏輯
            function handleSearch() {
                const keyword = searchInput.value.trim().toLowerCase();
                if (!keyword) return;

                // 移除按鈕目前的選中狀態
                if (currentActiveButton) {
                    currentActiveButton.className = `${baseClass} ${currentActiveDefaultClass}`;
                    currentActiveButton = null;
                    currentActiveDefaultClass = null;
                }

                let results = [];

                // 跨部門搜尋資料
                for (const [deptName, employees] of Object.entries(departmentData)) {
                    employees.forEach(emp => {
                        const nameMatch = emp.name && emp.name.toLowerCase().includes(keyword);
                        const titleMatch = emp.title && emp.title.toLowerCase().includes(keyword);
                        const extMatch = emp.ext && String(emp.ext).toLowerCase().includes(keyword);

                        if (nameMatch || titleMatch || extMatch) {
                            results.push({ department: deptName, ...emp });
                        }
                    });
                }

                updateTable(results, `搜尋結果：「${keyword}」`);
            }

            // 綁定搜尋按鈕事件
            searchBtn.addEventListener('click', handleSearch);

            // 綁定 Enter 鍵觸發搜尋
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSearch();
                }
            });

            // 2. 更新表格的函數
            function updateTable(data, titleText) {
                // 清空目前的表格內容
                tableBody.innerHTML = '';

                // 更新標題顯示
                currentViewTitle.textContent = titleText;
                currentViewTitle.classList.remove('hidden');

                // 顯示表格，隱藏初始提示區塊
                tableElement.classList.remove('hidden');
                emptyState.classList.add('hidden');

                if (data && data.length > 0) {
                    // 迴圈建立表格行 (tr) 與欄位 (td)
                    data.forEach(item => {
                        const tr = document.createElement('tr');
                        // 加入 CSS 類別以實現條紋交錯與滑鼠懸停效果
                        tr.className = 'border-b border-gray-200 hover:bg-blue-50 even:bg-gray-50 odd:bg-white transition-colors duration-150 ease-in-out';
                        
                        tr.innerHTML = `
                            <td class="px-5 py-4 text-sm text-gray-900 whitespace-nowrap">${item.department || '-'}</td>
                            <td class="px-5 py-4 text-sm text-gray-900">${item.title}</td>
                            <td class="px-5 py-4 text-sm text-gray-900 font-medium">${item.name}</td>
                            <td class="px-5 py-4 text-sm text-blue-700 font-semibold">${item.ext}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                } else {
                    // 若無資料
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td colspan="4" class="px-5 py-8 text-center text-sm text-gray-500 bg-gray-50">
                            找不到相符資料。
                        </td>
                    `;
                    tableBody.appendChild(tr);
                }
            }
        });
    </script>
</body>
</html>
